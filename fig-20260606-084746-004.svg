<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">Figura compuesta de rectángulo y triángulo</title><desc id="d">Rectángulo de 10 por 9 cm con un triángulo de base 10 y altura 4 cm encima.</desc><rect x="0" y="0" width="400" height="300" fill="#ffffff"/><polygon points="130,140 230,60 330,140 330,320 130,320" fill="#e8eaf6" stroke="#1a237e" stroke-width="2.5"/><line x1="130" y1="140" x2="330" y2="140" stroke="#1a237e" stroke-width="1.5" stroke-dasharray="5,4"/><text x="230" y="342" text-anchor="middle" font-size="15" fill="#1a237e" font-weight="600" font-family="Georgia, serif">10 cm</text><text x="118" y="230" text-anchor="end" font-size="15" fill="#1a237e" font-weight="600" font-family="Georgia, serif">9 cm</text><text x="344" y="106" text-anchor="start" font-size="13" fill="#1a237e" font-weight="600" font-family="Georgia, serif">4 cm</text></svg>