<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">Figura compuesta de rectángulo y semicírculo en un extremo</title><desc id="d">Rectángulo de 12 por 8 cm con un semicírculo de radio 4 cm en el extremo izquierdo.</desc><rect x="0" y="0" width="400" height="300" fill="#ffffff"/><path d="M95,80 h192 v128 h-192 a64,64 0 0 1 0,-128 Z" fill="#e8eaf6" stroke="#1a237e" stroke-width="2.5"/><line x1="95" y1="80" x2="95" y2="208" stroke="#1a237e" stroke-width="1.3" stroke-dasharray="4,4"/><text x="191" y="228" text-anchor="middle" font-size="15" fill="#1a237e" font-weight="600" font-family="Georgia, serif">12 cm</text><text x="299" y="144" text-anchor="start" font-size="13" fill="#1a237e" font-weight="600" font-family="Georgia, serif">8 cm</text><text x="59" y="148" text-anchor="end" font-size="12" fill="#1a237e" font-weight="600" font-family="Georgia, serif">r = 4</text></svg>