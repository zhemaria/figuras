<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">Figura compuesta en forma de escalera de tres escalones</title><desc id="d">Una escalera de tres escalones iguales; cada escalón mide 3 cm de ancho por 2 cm de alto.</desc><rect x="0" y="0" width="400" height="300" fill="#ffffff"/><path d="M95,182 h198 v-44 h-66 v-44 h-66 v-44 h-66 Z" fill="#e8eaf6" stroke="#1a237e" stroke-width="2.5"/><text x="260" y="202" text-anchor="middle" font-size="13" fill="#1a237e" font-weight="600" font-family="Georgia, serif">3 cm</text><text x="305" y="160" text-anchor="start" font-size="13" fill="#1a237e" font-weight="600" font-family="Georgia, serif">2 cm</text></svg>