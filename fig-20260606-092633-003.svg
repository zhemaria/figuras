<svg viewBox="77 32 277 324" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">Figura compuesta en forma de escalera de tres escalones</title><desc id="d">Una escalera de tres escalones iguales; cada escalón mide 3 cm de ancho por 4 cm de alto.</desc><rect x="77" y="32" width="277" height="324" fill="#ffffff"/><path d="M95,314 h198 v-88 h-66 v-88 h-66 v-88 h-66 Z" fill="#e8eaf6" stroke="#1a237e" stroke-width="2.5"/><text x="260" y="334" text-anchor="middle" font-size="13" fill="#1a237e" font-weight="600" font-family="Georgia, serif">3 cm</text><text x="305" y="270" text-anchor="start" font-size="13" fill="#1a237e" font-weight="600" font-family="Georgia, serif">4 cm</text></svg>